name: bot
on:
  # schedule:   # 전환할 때 아래 두 줄의 주석(#)을 풀면 5분마다 이어서 실행됩니다
  #   - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: bot
  cancel-in-progress: false  # 한 번에 하나만: 앞 작업이 끝나야 다음이 시작
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 봇 실행
        env:
          DOTENV: ${{ secrets.DOTENV }}
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_DEPLOY_KEY: ${{ secrets.DATA_DEPLOY_KEY }}
        run: sh deploy/gh_run.sh
